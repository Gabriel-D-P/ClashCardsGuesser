<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe a Carta - Clash Royale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <a href="index.html">Jogo</a>
    <a href="sobre.html">Sobre</a>
</div>

<h1>Adivinhe a Carta do Clash Royale</h1>

<div id="form-container">
    <form id="jogo-form">
        <div class="autocomplete-container" style="position: relative; width: 100%; max-width: 320px; margin: 0 auto;">
            <input type="text" id="tentativa" placeholder="Digite o nome da carta" required autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <div class="botoes-container">
            <input type="submit" value="Enviar tentativa">
            <button type="button" id="btn-desistir" class="desistir" style="display: none;">Desistir 🏳️</button>
        </div>
    </form>
</div>

<div id="resultado-container"></div>

<script src="cartas.js"></script>
<script src="script.js"></script>

</body>
</html>
